<!DOCTYPE html>
<html>

<head>
    <title>Login - E-Tech</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation Bar -->
    <header>

        <h1>E-Tech</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="login.html">Login</a>
            <a href="register.html">Register</a>
            <a href="contact.html">Contact</a>
        </nav>

    </header>


    <!-- Login Section -->
    <section class="login-page">

        <div class="login-box">

            <h2>Login to E-Tech</h2>

            <p>
                Welcome back! Please enter your details.
            </p>

            <form action="dashboard.html">

                <label>Email</label>

                <input type="email"
                       placeholder="Enter your email"
                       required>


                <label>Password</label>

                <input type="password"
                       placeholder="Enter your password"
                       required>


                <button type="submit">
                    Login
                </button>

            </form>

            <p>
                New to E-Tech?
                <a href="register.html">Create an account</a>
            </p>

        </div>

    </section>


    <!-- Footer -->
    <footer>

        <h3>E-Tech - E-Waste Management System</h3>

        <p>
            Responsible e-waste management for a cleaner future.
        </p>

        <p>
            © 2026 E-Tech. All rights reserved.
        </p>

    </footer>

</body>

</html>
