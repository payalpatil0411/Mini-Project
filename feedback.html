
<!DOCTYPE html>
<html>

<head>
    <title>Feedback - E-Tech</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>E-Tech</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="contact.html">Contact</a>
            <a href="login.html">Logout</a>
        </nav>
    </header>

    <section class="feedback-page">

        <div class="feedback-box">

            <h2>Share Your Feedback</h2>

            <p>Tell us about your E-Tech pickup experience.</p>

            <form action="my_requests.html">

                <label>Full Name</label>
                <input type="text" placeholder="Enter your full name" required>

                <label>Email Address</label>
                <input type="email" placeholder="Enter your email" required>

                <label>Rate Your Experience</label>
                <select required>
                    <option value="">Select your rating</option>
                    <option>Excellent</option>
                    <option>Very Good</option>
                    <option>Good</option>
                    <option>Average</option>
                    <option>Poor</option>
                </select>

                <label>Feedback</label>
                <textarea rows="5"
                    placeholder="Write your feedback here"
                    required></textarea>

                <button type="submit">Submit Feedback</button>

            </form>

            <p>
                <a href="my_requests.html">Back to My Requests</a>
            </p>

        </div>

    </section>

    <footer>
        <h3>E-Tech - E-Waste Management System</h3>
        <p>Responsible e-waste management for a cleaner future.</p>
        <p>© 2026 E-Tech. All rights reserved.</p>
    </footer>

</body>

</html>
